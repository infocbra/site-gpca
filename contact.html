<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="description" content="Página de contato do GPCA" />
    <meta name="author" content="GPCA" />
    <title>Contatos • GPCA</title>
    <link rel="icon" type="image/x-icon" href="assets/gpca.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@100;200;300;400;500;600;700;800;900&amp;display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css" rel="stylesheet" />
    <link href="css/styles.css" rel="stylesheet" />
    
</head>
<body class="d-flex flex-column site-page">
    <nav class="navbar navbar-expand-lg navbar-light bg-white fixed-top py-3 shadow-sm site-navbar">
        <div class="container px-4 px-lg-5">
            <a class="navbar-brand" href="index.html"><span class="fw-bolder text-primary">GPCA</span></a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Alternar navegação">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav ms-auto mb-2 mb-lg-0 small fw-bolder">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="resume.html">Sobre</a></li>
                    <li class="nav-item"><a class="nav-link" href="projects.html">Projetos</a></li>
                    <li class="nav-item"><a class="nav-link" href="equipe.html">Equipe</a></li>
                    <li class="nav-item"><a class="nav-link active" aria-current="page" href="contact.html">Contatos</a></li>
                </ul>
            </div>
        </div>
    </nav>
    <main class="flex-shrink-0">
        
<section class="py-5">
    <div class="container px-4 px-lg-5">
        <div class="bg-light rounded-4 py-5 px-4 px-md-5 shadow-sm">
            <div class="text-center mb-5">
                <div class="feature bg-primary bg-gradient-primary-to-secondary text-white rounded-3 mb-3 d-inline-flex p-3">
                    <i class="bi bi-envelope"></i>
                </div>
                <h1 class="fw-bolder">Entre em contato</h1>
                <p class="lead fw-normal text-muted mb-0">Vamos pesquisar juntos.</p>
            </div>
            <div class="row gx-5 justify-content-center">
                <div class="col-lg-8 col-xl-6">
                    <form id="contactForm" novalidate>
                        <div class="form-floating mb-3">
                            <input class="form-control" id="name" type="text" placeholder="Nome completo" />
                            <label for="name">Nome completo</label>
                        </div>
                        <div class="form-floating mb-3">
                            <input class="form-control" id="email" type="email" placeholder="nome@exemplo.com" />
                            <label for="email">E-mail</label>
                        </div>
                        <div class="form-floating mb-3">
                            <input class="form-control" id="phone" type="tel" placeholder="(61) 99999-9999" />
                            <label for="phone">Telefone</label>
                        </div>
                        <div class="form-floating mb-4">
                            <textarea class="form-control" id="message" placeholder="Escreva sua mensagem" style="height: 10rem"></textarea>
                            <label for="message">Mensagem</label>
                        </div>
                        <div class="d-grid">
                            <button class="btn btn-primary btn-lg disabled" type="button">Envio a configurar</button>
                        </div>
                    </form>
                    <p class="small text-muted mt-3 mb-0">
                        Ajuste manualmente a estratégia de envio deste formulário caso o site vá usar backend, serviço externo ou redirecionamento por e-mail.
                    </p>
                </div>
            </div>
        </div>
    </div>
</section>

    </main>
    <footer class="bg-white py-4 mt-auto border-top">
        <div class="container px-4 px-lg-5">
            <div class="row align-items-center justify-content-between flex-column flex-sm-row gy-2">
                <div class="col-auto"><div class="small m-0">Copyright &copy; GPCA 2025</div></div>
                <div class="col-auto">
                    <a class="small" href="resume.html">Sobre</a>
                    <span class="mx-1">&middot;</span>
                    <a class="small" href="equipe.html">Equipe</a>
                    <span class="mx-1">&middot;</span>
                    <a class="small" href="contact.html">Contatos</a>
                </div>
            </div>
        </div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/scripts.js"></script>
</body>
</html>
